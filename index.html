<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>와이즈만영재교육 하남센터 수업 후기</title><style>body{margin:0;background:#fff3f5;font:16px system-ui,sans-serif;color:#292327}header{background:#aa2148;color:#fff;text-align:center;padding:24px}main{max-width:700px;margin:28px auto;padding:0 16px}.card{background:white;padding:25px;border-radius:16px;box-shadow:0 4px 24px #8f17321c}label{display:block;font-weight:600;margin-top:16px}input,select,textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit}textarea{height:100px}button{border:0;border-radius:8px;padding:12px 17px;background:#aa2148;color:white;margin:10px 5px 8px 0;cursor:pointer}.alt{background:#eee;color:#333}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}article{border-top:1px solid #ddd;padding:16px 0;overflow-wrap:anywhere}article p{white-space:pre-wrap}.small{font-size:13px;color:#655}#admin{display:none}[hidden]{display:none!important}</style><header><h2>와이즈만영재교육 하남센터</h2>우리들의 수업 후기</header><main><section class="card" id="student"><button id="open" class="alt">관리자</button><h2>오늘 수업은 어땠나요? ✨</h2><form id="form"><label>학생 이름 *<input id="name" required maxlength="30"></label><label>학년 *<select id="grade" required><option value="">선택</option><option>7세</option><option>초1</option><option>초2</option><option>초3</option><option>초4</option><option>초5</option><option>초6</option><option>중1</option><option>중2</option><option>중3</option></select></label><label>수강 과목 *<select id="subject"><option>과학실험</option><option>사고력수학</option><option>과학·수학 모두</option><option>특별활동·현장학습</option></select></label><label>만족도 *<select id="rating"><option value="5">★★★★★ 아주 좋아요</option><option value="4">★★★★ 좋아요</option><option value="3">★★★ 보통</option><option value="2">★★ 아쉬워요</option><option value="1">★ 별로였어요</option></select></label><label>좋았던 점<textarea id="good" maxlength="1000"></textarea></label><label>기억에 남는 활동 *<textarea id="best" minlength="5" maxlength="1000" required></textarea></label><label>앞으로 바라는 점<textarea id="change" maxlength="1000"></textarea></label><p class="small">학생 이름·학년·과목과 후기를 수집하며 학원 관리자만 열람합니다. 삭제 요청은 학원에 문의해 주세요.</p><label class="check"><input type="checkbox" required>개인정보 수집·이용 동의 (필수)</label><label class="check"><input type="checkbox" id="publish">이름을 제외한 후기 홍보 활용 동의 (선택)</label><button type="submit" id="send">후기 제출하기</button><p id="msg" role="status"></p></form></section><section class="card" id="admin"><button class="alt" id="back">접수 화면</button><h2>관리자 후기 관리</h2><div id="setupPanel" hidden><h3>관리자 비밀번호 설정</h3><p>초대 또는 비밀번호 재설정 이메일의 링크로 들어오셨습니다.</p><label>새 비밀번호 (8자 이상)<input id="newPassword" type="password" minlength="8" autocomplete="new-password"></label><button id="savePassword">비밀번호 저장</button><p id="setupMessage" role="status"></p></div><div id="loginPanel"><label>관리자 이메일<input type="email" id="email"></label><label>비밀번호<input type="password" id="password"></label><button id="login">로그인</button><button id="resetPassword" class="alt">비밀번호 설정 이메일 다시 받기</button></div><div id="dashboard" hidden><button id="refresh">새로고침</button><button id="download">CSV 다운로드</button><button class="alt" id="logout">로그아웃</button><p id="stats"></p><div id="entries"></div></div><p id="adminMsg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://manscpjvvpiucefuovqk.supabase.co','sb_publishable_cQJ-TkK4TIQUEaHu4OF5Kg_DCf5uMQe');const el=x=>document.getElementById(x),escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let records=[];el('open').onclick=()=>{el('student').style.display='none';el('admin').style.display='block';sync()};el('back').onclick=()=>{el('admin').style.display='none';el('student').style.display='block'};el('form').onsubmit=async e=>{e.preventDefault();el('send').disabled=true;el('msg').textContent='전송 중...';const {error}=await db.from('wise_reviews').insert({student_name:el('name').value.trim(),grade:el('grade').value,subject:el('subject').value,rating:+el('rating').value,good:el('good').value.trim()?[el('good').value.trim()]:[],best:el('best').value.trim(),change_request:el('change').value.trim(),publish:el('publish').checked});el('send').disabled=false;el('msg').textContent=error?'접수 실패: '+error.message:'후기가 접수됐어요. 고마워요!';if(!error)el('form').reset()};el('savePassword').onclick=async()=>{const p=el('newPassword').value;if(p.length<8){el('setupMessage').textContent='비밀번호는 8자 이상으로 설정해 주세요.';return}const {error}=await db.auth.updateUser({password:p});el('setupMessage').textContent=error?'설정 실패: '+error.message:'비밀번호가 설정되었습니다. 이제 관리자 페이지에 로그인할 수 있어요.';if(!error){el('newPassword').value='';el('setupPanel').hidden=true;history.replaceState({},'',location.pathname);sync()}};el('resetPassword').onclick=async()=>{const email=el('email').value.trim();if(!email){el('adminMsg').textContent='관리자 이메일을 먼저 입력해 주세요.';return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});el('adminMsg').textContent=error?'이메일 요청 실패: '+error.message:'비밀번호 설정 링크를 발송했습니다. 메일함을 확인해 주세요.'};db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){el('student').style.display='none';el('admin').style.display='block';el('setupPanel').hidden=false;el('loginPanel').hidden=true;el('dashboard').hidden=true}});if(location.hash.includes('type=invite')||location.hash.includes('type=recovery')){el('student').style.display='none';el('admin').style.display='block';el('setupPanel').hidden=false}el('login').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});el('adminMsg').textContent=error?'로그인 실패: '+error.message:'';if(!error)sync()};el('logout').onclick=async()=>{await db.auth.signOut();sync()};async function sync(){const {data:{session}}=await db.auth.getSession();el('loginPanel').hidden=!!session;el('dashboard').hidden=!session;if(session)refresh()}el('refresh').onclick=refresh;async function refresh(){const {data,error}=await db.from('wise_reviews').select('*').order('created_at',{ascending:false}).limit(1000);if(error){el('adminMsg').textContent=error.message;return}records=data||[];el('stats').textContent='후기 '+records.length+'건';el('entries').innerHTML=records.map(x=>'<article><b>'+escapeHtml(x.student_name)+' / '+escapeHtml(x.grade)+' / '+escapeHtml(x.subject)+' / ★'+x.rating+'</b><p>'+escapeHtml(x.best)+'</p><p>좋았던 점: '+escapeHtml((x.good||[]).join(', '))+'</p><p>바라는 점: '+escapeHtml(x.change_request)+'</p><p>홍보 동의: '+(x.publish?'예':'아니요')+'</p><button data-id="'+x.id+'" class="alt">삭제</button></article>').join('')||'후기가 없거나 관리자 권한이 없습니다.';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('이 후기를 삭제하시겠어요?'))return;const {error}=await db.from('wise_reviews').delete().eq('id',b.dataset.id);if(error)alert(error.message);else refresh()})}el('download').onclick=()=>{const columns=['created_at','student_name','grade','subject','rating','good','best','change_request','publish'],q=x=>'"'+String(Array.isArray(x)?x.join('; '):x??'').replace(/^[=+@-]/,m=>"'"+m).replace(/"/g,'""')+'"',content=[columns.join(','),...records.map(r=>columns.map(c=>q(r[c])).join(','))].join('\r\n'),url=URL.createObjectURL(new Blob(['\uFEFF'+content],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download='wise_reviews.csv';a.click();URL.revokeObjectURL(url)};
</script></html>
